<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Novo aluno</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<h1>Novo aluno</h1>

<form th:action="@{/alunos}" th:object="${aluno}" method="post">

  <label>
    Nome
    <input type="text" th:field="*{nome}">
  </label>
  <p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>

  <label>
    E-mail
    <input type="email" th:field="*{email}">
  </label>
  <p class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

  <label>
    Nota
    <input type="number" step="0.1" min="0" max="10" th:field="*{nota}">
  </label>
  <p class="erro" th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}"></p>

  <button type="submit">Salvar</button>
  <a th:href="@{/alunos}">Cancelar</a>
</form>
</body>
</html>
